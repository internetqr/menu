<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>NEURAL CORE // CLASSIFIED</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Consolas,monospace;
}

body{
  background:black;
  color:#00ff88;
  overflow:hidden;
  height:100vh;
}

/* MATRIX BACKGROUND */
canvas{
  position:fixed;
  inset:0;
  opacity:0.12;
}

/* SCAN OVERLAY */
#scan{
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at center,transparent,rgba(0,255,136,0.05));
  pointer-events:none;
}

/* TERMINAL */
#terminal{
  position:absolute;
  inset:0;
  padding:20px;
  white-space:pre-line;
  line-height:1.6;
  text-shadow:0 0 8px #00ff88;
  z-index:2;
}

/* BUTTON */
.btn{
  margin-top:15px;
  background:black;
  border:1px solid #00ff88;
  color:#00ff88;
  padding:14px;
  width:100%;
  max-width:320px;
  cursor:pointer;
}

/* GLITCH */
.glitch{
  animation:glitch .08s infinite;
}

@keyframes glitch{
  0%{transform:translate(2px,-1px);}
  50%{transform:translate(-2px,2px);}
  100%{transform:translate(0,0);}
}

/* RED ALERT */
.red{
  animation:redflash .2s infinite;
}

@keyframes redflash{
  50%{background:#200000;}
}

/* FACE SCAN */
#face{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:180px;
  height:180px;
  border:2px solid #00ff88;
  border-radius:50%;
  display:none;
  animation:scanMove 2s infinite;
}

@keyframes scanMove{
  0%{box-shadow:0 -80px 20px rgba(0,255,136,0.2);}
  50%{box-shadow:0 80px 20px rgba(0,255,136,0.2);}
  100%{box-shadow:0 -80px 20px rgba(0,255,136,0.2);}
}

/* FINAL CRASH */
#crash{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:black;
  z-index:999;
  color:red;
  text-align:center;
}

#crash h1{
  font-size:4rem;
  text-shadow:0 0 20px red;
  animation:pulse .4s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.1);}
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div id="scan"></div>

<div id="face"></div>

<div id="terminal"></div>

<div id="crash">
  <h1>SISTEMA COMPROMETIDO</h1>
  <p style="color:white;margin-top:20px;">Neural Core desconectado</p>
</div>

<script>

//////////////////////////////////////////////////////
// MATRIX
//////////////////////////////////////////////////////

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const chars="01アイウエオカキクケコ";
const size=14;
const cols=canvas.width/size;

const drops=Array(Math.floor(cols)).fill(1);

function draw(){

  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff88";
  ctx.font=size+"px monospace";

  for(let i=0;i<drops.length;i++){

    const t=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(t,i*size,drops[i]*size);

    if(drops[i]*size>canvas.height && Math.random()>0.975){
      drops[i]=0;
    }

    drops[i]++;
  }
}

setInterval(draw,35);

//////////////////////////////////////////////////////
// TERMINAL
//////////////////////////////////////////////////////

const terminal=document.getElementById("terminal");
const face=document.getElementById("face");

let stage=0;

//////////////////////////////////////////////////////
// VOZ IA
//////////////////////////////////////////////////////

function speak(t){

  const msg=new SpeechSynthesisUtterance(t);
  msg.lang="es-ES";
  msg.rate=1;
  msg.pitch=0.7;
  speechSynthesis.speak(msg);

}

//////////////////////////////////////////////////////
// TYPE
//////////////////////////////////////////////////////

async function type(t){

  for(let i=0;i<t.length;i++){
    terminal.innerHTML+=t[i];
    await sleep(18);
  }

  terminal.innerHTML+="\n";
  terminal.scrollTop=terminal.scrollHeight;
}

//////////////////////////////////////////////////////
// INICIO
//////////////////////////////////////////////////////

async function start(){

  await type("[NEURAL CORE ONLINE]");
  speak("Neural core conectado");

  await sleep(800);

  await type("Analizando entorno...");

  await type("Usuario detectado.");

  button("INICIAR ESCANEO BIOMÉTRICO", scan);

}

//////////////////////////////////////////////////////
// SCAN FACE SIMULADO
//////////////////////////////////////////////////////

async function scan(){

  document.querySelector(".btn").remove();

  face.style.display="block";

  speak("Iniciando escaneo facial");

  await type("Escaneo biométrico activo...");

  await sleep(2000);

  await type("Rostro identificado.");

  await type("Probabilidad coincidencia: 98.7%");

  face.style.display="none";

  button("CONTINUAR PROCESO", hack);

}

//////////////////////////////////////////////////////
// HACK SEQUENCE
//////////////////////////////////////////////////////

async function hack(){

  document.querySelector(".btn").remove();

  document.body.classList.add("glitch");

  speak("Accediendo sistema interno");

  await type("Sincronizando red neuronal...");

  await type("Acceso parcial concedido.");

  await type("⚠ anomalía detectada ⚠");

  await sleep(1200);

  button("INTERRUMPIR", panic);

}

//////////////////////////////////////////////////////
// PANIC
//////////////////////////////////////////////////////

async function panic(){

  document.querySelector(".btn").remove();

  document.body.classList.add("red");

  speak("Intento de interrupción detectado");

  await type("Cancelación denegada.");

  await type("Bloqueo de sistema iniciado...");

  setTimeout(()=>{

    document.getElementById("crash").style.display="flex";

    speak("Sistema colapsado");

    document.body.style.filter="brightness(0.4) contrast(200%)";

  },3000);

}

//////////////////////////////////////////////////////
// BUTTON
//////////////////////////////////////////////////////

function button(text,fn){

  terminal.innerHTML+=`
    <button class="btn" onclick="${fn.name}()">${text}</button>
  `;
}

//////////////////////////////////////////////////////
// HELPERS
//////////////////////////////////////////////////////

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

//////////////////////////////////////////////////////
// FULLSCREEN
//////////////////////////////////////////////////////

document.body.addEventListener("click",()=>{

  document.documentElement.requestFullscreen().catch(()=>{});

},{once:true});

start();

</script>

</body>
</html>
