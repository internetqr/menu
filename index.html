<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">

<title>NEURAL CORE</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Consolas,monospace;
}

body{
  background:black;
  color:#00ff88;
  height:100vh;
  overflow:hidden;
}

/* MATRIX */
canvas{
  position:fixed;
  inset:0;
  opacity:0.10;
}

/* TERMINAL MOBILE SAFE */
#terminal{

  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;

  padding:16px;

  font-size:0.95rem;
  line-height:1.5;

  white-space:pre-wrap;
  word-break:break-word;

  overflow-y:auto;

  text-shadow:0 0 6px #00ff88;
}

/* BUTTON BIG MOBILE */
.btn{

  margin-top:12px;

  width:100%;
  padding:16px;

  font-size:1rem;

  background:black;
  border:1px solid #00ff88;
  color:#00ff88;

  border-radius:8px;

}

/* GLITCH */
.glitch{
  animation:glitch .08s infinite;
}

@keyframes glitch{
  0%{transform:translate(1px,-1px);}
  50%{transform:translate(-1px,1px);}
  100%{transform:translate(0,0);}
}

/* RED ALERT */
.red{
  animation:red 0.2s infinite;
}

@keyframes red{
  50%{background:#200000;}
}

/* FAKE CAMERA */
#cam{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:140px;
  height:140px;
  border:2px solid #00ff88;
  border-radius:50%;
  display:none;
  animation:scan 1.5s infinite;
}

@keyframes scan{
  0%{box-shadow:0 -60px 20px rgba(0,255,136,0.2);}
  50%{box-shadow:0 60px 20px rgba(0,255,136,0.2);}
  100%{box-shadow:0 -60px 20px rgba(0,255,136,0.2);}
}

/* FINAL */
#crash{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:black;
  color:red;
  text-align:center;
}

#crash h1{
  font-size:3rem;
  text-shadow:0 0 20px red;
  animation:pulse .4s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.1);}
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="cam"></div>

<div id="terminal"></div>

<div id="crash">
  <h1>ERROR</h1>
  <p style="color:white;margin-top:15px;">Sistema detenido</p>
</div>

<script>

//////////////////////////////////////////////////////
// MATRIX
//////////////////////////////////////////////////////

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const chars="01アイウエオカキクケコ";
const size=14;
const cols=canvas.width/size;

const drops=Array(Math.floor(cols)).fill(1);

function draw(){

  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff88";
  ctx.font=size+"px monospace";

  for(let i=0;i<drops.length;i++){

    const t=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(t,i*size,drops[i]*size);

    if(drops[i]*size>canvas.height && Math.random()>0.975){
      drops[i]=0;
    }

    drops[i]++;
  }
}

setInterval(draw,35);

//////////////////////////////////////////////////////
// CORE
//////////////////////////////////////////////////////

const terminal=document.getElementById("terminal");
const cam=document.getElementById("cam");

//////////////////////////////////////////////////////
// VOZ
//////////////////////////////////////////////////////

function speak(t){

  const msg=new SpeechSynthesisUtterance(t);
  msg.lang="es-ES";
  msg.rate=1;
  msg.pitch=0.7;
  speechSynthesis.speak(msg);

}

//////////////////////////////////////////////////////
// TYPE (CORTO PARA MÓVIL)
//////////////////////////////////////////////////////

async function type(t){

  for(let i=0;i<t.length;i++){
    terminal.innerHTML+=t[i];
    terminal.scrollTop=terminal.scrollHeight;
    await sleep(15);
  }

  terminal.innerHTML+="\n";
}

//////////////////////////////////////////////////////
// START
//////////////////////////////////////////////////////

async function start(){

  await type("[CORE ONLINE]");
  speak("Sistema activo");

  await type("Usuario detectado");

  button("INICIAR", scan);

}

//////////////////////////////////////////////////////
// SCAN
//////////////////////////////////////////////////////

async function scan(){

  document.querySelector(".btn").remove();

  cam.style.display="block";

  speak("Escaneo iniciado");

  await type("Escaneo activo");

  await sleep(1800);

  await type("Identidad OK");

  cam.style.display="none";

  button("CONTINUAR", hack);

}

//////////////////////////////////////////////////////
// HACK
//////////////////////////////////////////////////////

async function hack(){

  document.querySelector(".btn").remove();

  document.body.classList.add("glitch");

  speak("Acceso interno");

  await type("Red conectada");

  await type("⚠ alerta ⚠");

  button("DETENER", panic);

}

//////////////////////////////////////////////////////
// PANIC
//////////////////////////////////////////////////////

async function panic(){

  document.querySelector(".btn").remove();

  document.body.classList.add("red");

  speak("Bloqueo activo");

  await type("Cancelado");

  await type("Sistema bloqueado");

  setTimeout(()=>{

    document.getElementById("crash").style.display="flex";

    speak("Colapso");

  },2500);

}

//////////////////////////////////////////////////////
// BUTTON
//////////////////////////////////////////////////////

function button(t,fn){

  terminal.innerHTML+=`
    <button class="btn" onclick="${fn.name}()">${t}</button>
  `;

}

//////////////////////////////////////////////////////
// HELPERS
//////////////////////////////////////////////////////

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

//////////////////////////////////////////////////////
// FULLSCREEN
//////////////////////////////////////////////////////

document.body.addEventListener("click",()=>{

  document.documentElement.requestFullscreen().catch(()=>{});

},{once:true});

start();

</script>

</body>
</html>
