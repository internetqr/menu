<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>SISTEMA IA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas,monospace;
}

body{
    background:black;
    color:#00ff66;
    overflow:hidden;
    height:100vh;
}

#bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at center,#002211,#000000 70%);
}

#terminal{

    position:absolute;
    inset:0;

    padding:25px;

    white-space:pre-line;

    line-height:1.7;

    text-shadow:0 0 10px #00ff66;

    font-size:1rem;
}

.btn{

    margin-top:20px;

    background:black;

    color:#00ff66;

    border:1px solid #00ff66;

    padding:14px 22px;

    font-size:1rem;

    cursor:pointer;

    width:100%;

    max-width:320px;

    transition:0.2s;
}

.btn:hover{
    background:#00ff66;
    color:black;
}

.glitch{
    animation:glitch .08s infinite;
}

@keyframes glitch{

    0%{transform:translate(2px,-1px);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(1px,2px);}
    75%{transform:translate(-1px,-2px);}
    100%{transform:translate(0,0);}
}

.flash{
    animation:flash .15s infinite;
}

@keyframes flash{

    0%{background:black;}
    50%{background:#220000;}
    100%{background:black;}
}

#crash{

    position:fixed;
    inset:0;

    background:black;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:999;

    color:red;

    text-align:center;

    animation:shake .1s infinite;
}

@keyframes shake{

    0%{transform:translate(2px,1px);}
    25%{transform:translate(-2px,-1px);}
    50%{transform:translate(3px,-2px);}
    75%{transform:translate(-3px,2px);}
    100%{transform:translate(0,0);}
}

#big{

    font-size:4rem;

    text-shadow:
    0 0 20px red,
    0 0 40px red;

    animation:pulse .5s infinite;
}

@keyframes pulse{

    50%{
        transform:scale(1.08);
    }
}

#small{
    margin-top:25px;
    font-size:1rem;
    color:white;
}

</style>
</head>

<body>

<div id="bg"></div>

<div id="terminal"></div>

<div id="crash">

<div id="big">
ERROR CRÍTICO
</div>

<div id="small">
EL SISTEMA HA SIDO COMPROMETIDO
</div>

</div>

<script>

const terminal = document.getElementById("terminal");
const crash = document.getElementById("crash");

//////////////////////////////////////////////////////////////////
// TYPE EFFECT
//////////////////////////////////////////////////////////////////

async function type(text){

    for(let i=0;i<text.length;i++){

        terminal.innerHTML += text[i];

        await sleep(25);

    }

    terminal.innerHTML += "\n";
}

//////////////////////////////////////////////////////////////////
// START
//////////////////////////////////////////////////////////////////

async function start(){

    await type("[NODO IA ENLAZADO]");
    await sleep(500);

    await type("Detectando actividad externa...");
    await sleep(800);

    await type("Dispositivo localizado.");
    await sleep(1000);

    terminal.innerHTML += `
    
    <button class="btn" onclick="scan()">
    PERMITIR ESCANEO
    </button>
    
    `;
}

//////////////////////////////////////////////////////////////////
// SCAN
//////////////////////////////////////////////////////////////////

async function scan(){

    document.querySelector(".btn").remove();

    await type("");
    await type("Escaneando sistema...");
    await sleep(1200);

    await type("Acceso parcial concedido.");
    await sleep(800);

    await type("⚠ Anomalía detectada.");
    await sleep(1200);

    terminal.innerHTML += `
    
    <button class="btn" onclick="continueProcess()">
    CONTINUAR
    </button>
    
    `;
}

//////////////////////////////////////////////////////////////////
// CONTINUE
//////////////////////////////////////////////////////////////////

async function continueProcess(){

    document.querySelector(".btn").remove();

    document.body.classList.add("glitch");

    await type("");
    await type("Sincronizando cámara frontal...");
    await sleep(1000);

    await type("Intentando aislamiento del sistema...");
    await sleep(1200);

    await type("ERROR 547-A");
    await sleep(1200);

    await type("La IA ha tomado el control.");
    await sleep(1400);

    terminal.innerHTML += `
    
    <button class="btn" onclick="panic()">
    CANCELAR PROCESO
    </button>
    
    `;
}

//////////////////////////////////////////////////////////////////
// FINAL
//////////////////////////////////////////////////////////////////

async function panic(){

    document.querySelector(".btn").remove();

    await type("");
    await type("Cancelación denegada.");
    await sleep(1000);

    await type("⚠ BLOQUEO INICIADO ⚠");
    await sleep(700);

    document.body.classList.add("flash");

    if(navigator.vibrate){

        navigator.vibrate([
            200,100,
            200,100,
            300,100,
            500
        ]);
    }

    await sleep(2500);

    document.body.innerHTML += `
    
    <div style="
    position:fixed;
    inset:0;
    background:
    repeating-linear-gradient(
    45deg,
    transparent,
    transparent 10px,
    rgba(255,255,255,0.04) 10px,
    rgba(255,255,255,0.04) 20px
    );
    z-index:998;
    ">
    </div>
    
    `;

    crash.style.display="flex";

}

//////////////////////////////////////////////////////////////////
// HELPERS
//////////////////////////////////////////////////////////////////

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

//////////////////////////////////////////////////////////////////
// FULLSCREEN
//////////////////////////////////////////////////////////////////

document.body.addEventListener("click",()=>{

    document.documentElement.requestFullscreen().catch(()=>{});

},{once:true});

//////////////////////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////////////////////

start();

</script>

</body>
</html>
