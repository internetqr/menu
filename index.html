<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Simulación de incidente</title>
  <style>
    :root{--bg:#030507;--fg:#d7ffe0;--green:#39ff88;--red:#ff3b3b;--amber:#ffb020;--panel:rgba(10,16,12,.82);--line:rgba(80,255,160,.18)}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
    body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,0) 2px);background-size:100% 3px;pointer-events:none;mix-blend-mode:overlay;opacity:.18}
    body::after{content:'';position:fixed;inset:0;background:radial-gradient(circle at center, transparent 0 35%, rgba(0,0,0,.45) 100%);pointer-events:none}
    .wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
    .grid{width:min(100%,980px);height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px}
    .top,.mid,.log,.bottom{background:var(--panel);border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.4) inset, 0 0 40px rgba(57,255,136,.06);backdrop-filter:blur(6px)}
    .top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .mid{padding:14px;border-left:4px solid var(--red);animation:glitch 2.7s infinite alternate}
    .title{font-size:clamp(26px,6vw,58px);line-height:1.05;color:#fff;text-shadow:0 0 12px rgba(255,59,59,.4),0 0 24px rgba(57,255,136,.18)}
    .subtitle{margin-top:8px;color:#b8c9bf;font-size:clamp(13px,2.8vw,18px)}
    .warn{margin-top:12px;color:var(--amber)}
    .log{padding:12px;overflow:auto;font-size:13px;line-height:1.5}
    .line{display:block;white-space:pre-wrap;word-break:break-word}
    .green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}
    .bottom{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px}
    button{appearance:none;border:1px solid rgba(57,255,136,.35);background:#07110a;color:var(--fg);padding:12px 14px;border-radius:12px;font:inherit;cursor:pointer;box-shadow:0 0 18px rgba(57,255,136,.08)}
    button.primary{background:linear-gradient(180deg,#112316,#07110a);color:#fff}
    .note{font-size:12px;opacity:.8}
    .blink{animation:blink 1s steps(1,end) infinite}
    .scan{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom, transparent, rgba(57,255,136,.08), transparent);animation:scan 4s linear infinite}
    .noise{position:fixed;inset:-20%;pointer-events:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="%22http://www.w3.org/2000/svg%22" width="120" height="120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity=".22"/></svg>');mix-blend-mode:screen;opacity:.07;transform:translate3d(0,0,0)}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
    @keyframes glitch{0%,100%{transform:translate(0)}20%{transform:translate(-1px,1px)}40%{transform:translate(1px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
    .fs .bottom .hint{display:none}
  </style>
</head>
<body>
  <div class="noise"></div><div class="scan"></div>
  <div class="wrap">
    <div class="grid" id="app">
      <div class="top">
        <div>Red segura · modo simulación</div>
        <div id="clock">00:00:00</div>
      </div>
      <div class="mid">
        <div class="title">COMPLETAR INSTALACION</div>
        <div class="subtitle">Instalar aplicación en el dispositivo. Desea cancelar la instalación...</div>
        <div class="warn blink">Fallo en la instalación.</div>
      </div>
      <div class="log" id="log"></div>
      <div class="bottom">
        <div>
          <button class="primary" id="start">Cancelar la instalación</button>
          <button id="sound">Activar sonido</button>
          <button id="escape">Continuar</button>
        </div>
        <div class="note hint">Esta aplicación garantiza la protección y el cifrado de sus datos, asegurando la máxima seguridad y confidencialidad de la información.</div>
      </div>
    </div>
  </div>
  <script>
    const lines = [
      '[01] Error al descargar los datos...',
      '[02] Comprobando el software del dispositivo...',
      '[03] Descargando Contraseñas...',
      '[04] Descargando datos almacenados',
      '[05] Descargando lista de contactos',
      '[06] Acceso remoto satisfactorio',
      '[07] Registrando ataque exterior...',
      '[08] Escaneo completo de los contactos',
      '[09] Reinicio falso en 3... 2... 1...',
      '[10] Advertencia: Ataque en curso'
    ];
    const log = document.getElementById('log');
    const clock = document.getElementById('clock');
    const app = document.getElementById('app');
    let i = 0, audioCtx, oscillator, gain;

    function tick(){ clock.textContent = new Date().toLocaleTimeString('es-ES'); }
    setInterval(tick,1000); tick();

    function addLine(){
      if(i<lines.length){
        const s=document.createElement('span');
        s.className='line';
        s.innerHTML = `<span class='green'>${lines[i].slice(0,4)}</span>${lines[i].slice(4)}`;
        log.appendChild(s);
        log.scrollTop = log.scrollHeight;
        i++;
      }
    }

    function startSound(){
      if(audioCtx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
      gain = audioCtx.createGain();
      gain.gain.value = 0.03;
      gain.connect(audioCtx.destination);
      oscillator = audioCtx.createOscillator();
      oscillator.type = 'sawtooth';
      oscillator.frequency.value = 42;
      oscillator.connect(gain);
      oscillator.start();
      setInterval(()=>{ if(audioCtx && audioCtx.state==='running') oscillator.frequency.setValueAtTime(38 + Math.random()*28, audioCtx.currentTime); }, 1200);
    }

    async function enterFS(){ try{ await document.documentElement.requestFullscreen(); app.classList.add('fs'); } catch(e){} }
    async function leaveFS(){ try{ if(document.fullscreenElement) await document.exitFullscreen(); app.classList.remove('fs'); } catch(e){} }

    document.getElementById('start').addEventListener('click', async ()=>{
      await enterFS();
      startSound();
      for(let j=0;j<4;j++){ setTimeout(addLine, j*700); }
      setInterval(addLine, 900);
    });
    document.getElementById('sound').addEventListener('click', startSound);
    document.getElementById('escape').addEventListener('click', leaveFS);
    for(let k=0;k<2;k++) setTimeout(addLine, k*1000);
  </script>
</body>
</html>
